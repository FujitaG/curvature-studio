name: Curvature Studio checks
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: curvature-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:runtime
      - run: npm run audit:all
      - run: npm run check
      - run: npm run test:math-sensitivity
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run qa:cross-browser
      - run: npm run qa:math
        env:
          QA_REQUIRE_WEBGL: '1'
      - run: npm run qa:templates
      - run: npm run qa:hosting
